name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.2'
          bundler-cache: true

      - name: Run test suite
        run: bundle exec rake test

      - name: Build and install gem
        run: |
          gem build fafx.gemspec
          gem install fafx-*.gem

      - name: Smoke test CLI
        run: |
          fafx --version
          fafx --help
